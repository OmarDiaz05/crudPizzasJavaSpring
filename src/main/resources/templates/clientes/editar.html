<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente</title>
</head>
<body>
    <h1>Editar Cliente</h1>
    <form th:action="@{/clientes/actualizar/{id}(id=${cliente.id})}" method="post">
        <label>Nombre:</label><br>
        <input type="text" name="nombre" th:value="${cliente.nombre}" required><br><br>
        <label>Teléfono:</label><br>
        <input type="text" name="telefono" th:value="${cliente.telefono}" required><br><br>
        <label>Dirección:</label><br>
        <input type="text" name="direccion" th:value="${cliente.direccion}" required><br><br>
        <button type="submit">Actualizar</button>
        <a th:href="@{/clientes}">Cancelar</a>
    </form>
</body>
</html>
