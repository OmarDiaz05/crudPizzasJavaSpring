<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebidas</title>
</head>
<body>
    <h1>Bebidas</h1>

    <a href="/bebidas/crear">Agregar nueva bebida</a>

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="bebida : ${bebidas}">
                <td th:text="${bebida.nombre}"></td>
                <td th:text="${bebida.descripcion}"></td>
                <td th:text="${bebida.precio}"></td>
                <td>
                    <a th:href="@{/bebidas/editar/{id}(id=${bebida.id})}">Editar</a>
                    <a th:href="@{/bebidas/borrar/{id}(id=${bebida.id})}" onclick="return confirm('¿Estás seguro de eliminar esta bebida?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
