<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Bebida</title>
</head>
<body>
    <h1>Editar Bebida</h1>
    <form th:action="@{/bebidas/actualizar/{id}(id=${bebida.id})}" method="post">
        <label>Nombre:</label><br>
        <input type="text" name="nombre" th:value="${bebida.nombre}" required><br><br>
        <label>Descripción:</label><br>
        <input type="text" name="descripcion" th:value="${bebida.descripcion}" required><br><br>
        <label>Precio:</label><br>
        <input type="number" step="0.01" name="precio" th:value="${bebida.precio}" required><br><br>
        <button type="submit">Actualizar</button>
        <a th:href="@{/bebidas}">Cancelar</a>
    </form>
</body>
</html>
